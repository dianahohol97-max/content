name: bloom focus — Pinterest

on:
  # ПАУЗА (13.08.2026, на прохання): bloom focus зупинено, повернути —
  # розкоментувати. Ручний запуск через workflow_dispatch лишається.
  # schedule:
  #   # Auto-generate pins twice a week: Monday + Thursday 04:00 UTC (07:00 Kyiv).
  #   # Each run creates one "day batch" of 14 pins → 28/week, which exactly
  #   # matches the poster's spend rate (4 pins/day × 7 = 28/week).
  #   - cron: "0 4 * * 1,4"
  workflow_dispatch:
    inputs:
      week:
        description: 'Week number'
        required: true
        default: '30'
      day:
        description: 'Single day (1-7) or empty for full week'
        required: false
        default: ''
      mode:
        description: 'What to run'
        required: true
        default: 'full'
        type: choice
        options:
          - 'full'              # generate text + all images
          - 'images-only'       # keep existing JSON, generate images
          - 'resume'            # keep JSON, generate ONLY missing images
      limit:
        description: 'Limit images (for testing, e.g. 5)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  pinterest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve inputs (cron-safe defaults)
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Cron run: week = current ISO week, day slot 1 on Monday / 2 on Thursday
            WEEK=$(date -u +%V | sed 's/^0//')
            DOW=$(date -u +%u)
            if [ "$DOW" = "4" ]; then DAY="2"; else DAY="1"; fi
            echo "week=$WEEK" >> "$GITHUB_OUTPUT"
            echo "day=$DAY" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "limit=" >> "$GITHUB_OUTPUT"
            echo "Cron run → week $WEEK, day $DAY, mode full"
          else
            echo "week=${{ github.event.inputs.week }}" >> "$GITHUB_OUTPUT"
            echo "day=${{ github.event.inputs.day }}" >> "$GITHUB_OUTPUT"
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ github.event.inputs.limit }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm install

      - name: Generate Pinterest pins (text)
        if: steps.cfg.outputs.mode == 'full'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${{ steps.cfg.outputs.day }}" ]; then
            node bloom/pinterest-generator.js --week=${{ steps.cfg.outputs.week }}
          else
            node bloom/pinterest-generator.js --week=${{ steps.cfg.outputs.week }} --day=${{ steps.cfg.outputs.day }}
          fi

      - name: Commit pins JSON to repo
        if: steps.cfg.outputs.mode == 'full'
        run: |
          git config user.name "bloom-bot"
          git config user.email "bot@bloomfocus.org"
          git pull --no-edit origin main || true
          cp pinterest_week_${{ steps.cfg.outputs.week }}.json pinterest_current.json
          git add pinterest_week_*.json pinterest_current.json -f
          git commit -m "pinterest text: week ${{ steps.cfg.outputs.week }}" || echo "nothing to commit"
          git push

      - name: Build pin images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--week=${{ steps.cfg.outputs.week }}"
          if [ -n "${{ steps.cfg.outputs.day }}" ]; then ARGS="$ARGS --day=${{ steps.cfg.outputs.day }}"; fi
          if [ -n "${{ steps.cfg.outputs.limit }}" ]; then ARGS="$ARGS --limit=${{ steps.cfg.outputs.limit }}"; fi
          if [ "${{ steps.cfg.outputs.mode }}" = "resume" ]; then ARGS="$ARGS --skip-existing=true"; fi
          node bloom/pinterest-build-all.js $ARGS

      - name: Commit images + updated JSON
        run: |
          git config user.name "bloom-bot"
          git config user.email "bot@bloomfocus.org"
          git pull --no-edit origin main || true
          cp pinterest_week_${{ steps.cfg.outputs.week }}.json pinterest_current.json
          git add output/pinterest/ pinterest_week_*.json pinterest_current.json -f
          git commit -m "pinterest images: week ${{ steps.cfg.outputs.week }} (${{ steps.cfg.outputs.mode }})" || echo "nothing to commit"
          git push

      - name: Print public image URLs
        run: |
          echo "=== PUBLIC PIN IMAGE URLS ==="
          for f in $(find output/pinterest/week_${{ steps.cfg.outputs.week }} -name "*.png" 2>/dev/null | sort); do
            echo "https://raw.githubusercontent.com/dianahohol97-max/content/main/$f"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloom-pinterest-week${{ steps.cfg.outputs.week }}
          path: |
            pinterest_week_*.json
            output/pinterest/
          retention-days: 7
