name: bloom focus — Veo pilot
on:
  workflow_dispatch:
concurrency:
  group: veo-pilot
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Veo clip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node bloom/veo-test.js
      - name: Commit result
        run: |
          git config user.name "veo-bot"
          git config user.email "bot@bloomfocus.org"
          git add -A
          git diff --cached --quiet || git commit -m "veo pilot: universal moment clip"
          git push
